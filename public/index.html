<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0c2830">
<title>The Chesters Christmas Conspiracy 🎄</title>
<style>
  *{box-sizing:border-box}
  :root{color-scheme:dark}
  body{margin:0;min-height:100vh;color:#fff4dc;background:radial-gradient(ellipse at 50% 20%,#20535a 0%,#102e37 47%,#061723 100%);text-align:center;font-family:Georgia,serif;overflow-x:hidden}
  body:before{content:"";pointer-events:none;position:fixed;inset:0;background:radial-gradient(#fff8cc 1px,transparent 1.8px);background-size:60px 60px;opacity:.28;animation:snowfall 18s linear infinite}
  @keyframes snowfall{to{background-position:0 600px}}
  main{position:relative;max-width:720px;margin:0 auto;padding:55px 18px 60px}
  .santa{font-size:64px;margin-bottom:12px;filter:drop-shadow(0 5px 12px #0006)}
  .eyebrow{text-transform:uppercase;letter-spacing:3px;color:#f9d38c;font-size:11px;font-weight:bold}
  h1{font-size:clamp(40px,7vw,70px);line-height:1.05;letter-spacing:-1px;margin:20px 0 25px}
  h2{font-size:clamp(24px,5vw,34px);margin:14px 0}
  p{font-size:17px;line-height:1.55}
  .card{margin:32px auto 22px;padding:30px 22px 34px;background:linear-gradient(125deg,#244c55e8,#173440eb);border:1px solid #dfb86c;border-radius:25px;box-shadow:0 16px 60px #06131a68}
  .sub{color:#f1e6d2}
  .badge{display:inline-block;color:#fff2cb;background:#50684a;border:1px solid #a8c49b;border-radius:40px;padding:7px 14px;font:12px Arial,sans-serif}
  button,.button{background:#bb2e3d;color:#fff;border:1px solid #f6c7a8;padding:15px 23px;font:bold 15px Arial,sans-serif;border-radius:30px;margin:8px 5px;cursor:pointer;box-shadow:0 3px 0 #711c25}
  button:hover{background:#d43b49}
  button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #f2d37f;outline-offset:2px}
  button.secondary{background:#214d57;border-color:#d8af68}
  button:disabled{opacity:.55}
  #musicToggle{position:fixed;top:12px;right:12px;z-index:12;background:#133c47e8;padding:11px 16px;font-size:13px}
  input,textarea{width:100%;max-width:510px;padding:15px;background:#fff;color:#1d2930;border:2px solid #e8d8b7;border-radius:12px;margin:8px auto;font:16px Arial,sans-serif}
  textarea{resize:vertical;min-height:90px}
  label{display:block;margin:14px 0 5px;font:600 14px Arial,sans-serif;text-align:left;max-width:510px;margin-left:auto;margin-right:auto}
  small,.foot{font-size:13px;color:#e6cfa3}
  .gifts{padding-left:0;list-style:none}
  .gifts li{margin:10px auto;padding:11px 12px;background:#ffffff12;border-radius:12px;max-width:420px}
  .name{font-size:clamp(43px,10vw,72px);color:#ffe39a;margin:16px 0;text-shadow:0 3px 12px #0008}
  .present{font-size:100px;line-height:1.3;cursor:pointer;animation:float 2.4s ease-in-out infinite}
  @keyframes float{50%{transform:translateY(-12px) rotate(-3deg)}}
  .reveal{animation:pop 1.0s both}
  @keyframes pop{from{transform:scale(.75);opacity:0}to{transform:scale(1);opacity:1}}
  .btnrow{display:flex;flex-wrap:wrap;justify-content:center;gap:3px}
  .divider{border:0;border-top:1px solid #ffffff40;margin:26px 0}
  .switch{font:14px Arial,sans-serif;color:#ffe6ae}
  .scroll{max-height:470px;overflow:auto;padding-right:5px}
  .invites{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .invites button{width:100%;margin:0}
  .invlink{font:12px Arial,sans-serif;overflow-wrap:anywhere;color:#fce6aa}
  @media(max-width:550px){main{padding-top:70px}.card{padding:24px 16px}.invites{grid-template-columns:1fr}#musicToggle{font-size:11px;padding:9px 11px}}
  @media(prefers-reduced-motion:reduce){*,*:before{animation:none!important}}
</style>
</head>
<body>
<button id="musicToggle" onclick="toggleMusic()">🔔 Play Christmas music</button>
<main>
<div class="santa">🎅🏻</div>
<div class="eyebrow">✦ A North Pole exclusive ✦</div>
<h1>The Chesters<br>Christmas Conspiracy</h1>
<p>Eight names. Four couples. One magical secret.</p>
<section class="card" id="app"><p>Preparing Santa's workshop…</p></section>
<p class="foot">🎁 £50 maximum · Christmas 2026</p>
</main>
<script>
const people=['Joan','Aidan','Donna','Michael','Jenna','Paul','Corinna','Jonathan'];
const app=document.getElementById('app');
const params=new URLSearchParams(location.search);
let token=params.get('invite'),session=params.get('session'),test=params.get('test')==='1',state=null;
let audioCtx,musicTimer,musicOn=false,musicIndex=0;
// Public-domain-style bell motif, synthesized in the browser. Audio is unlocked by a click.
const notes=[523.25,659.25,783.99,659.25,587.33,698.46,880,698.46,659.25,783.99,1046.5,783.99,698.46,587.33,523.25];
function bell(freq,t){
  const osc=audioCtx.createOscillator(),g=audioCtx.createGain();
  osc.type='sine';osc.frequency.value=freq;
  g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(.042,t+.028);g.gain.exponentialRampToValueAtTime(.001,t+.38);
  osc.connect(g).connect(audioCtx.destination);osc.start(t);osc.stop(t+.4);
}
function toggleMusic(){
  const b=document.getElementById('musicToggle');
  if(musicOn){clearInterval(musicTimer);musicOn=false;b.textContent='🔔 Play Christmas music';return}
  try{
    audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    audioCtx.resume();musicIndex=0;
    const beat=()=>{if(audioCtx.state==='running')bell(notes[musicIndex++%notes.length],audioCtx.currentTime)};
    beat();musicTimer=setInterval(beat,420);musicOn=true;b.textContent='🔇 Mute music';
  }catch(e){b.textContent='Music unavailable'}
}
function festiveMusic(){if(!musicOn)toggleMusic()}
function safe(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function error(e){app.innerHTML='<h2>🎅 Oops!</h2><p>'+safe(e.message||e)+'</p><button onclick="home()">Try again</button>'}
async function api(action,extra={}){
  const res=await fetch('/.netlify/functions/santa',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action,test,session,token,...extra})});
  const data=await res.json();
  if(!res.ok)throw new Error(data.error||'Could not reach Santa’s workshop');
  return data;
}
function setLocation(){
  const q=new URLSearchParams();
  if(test)q.set('test','1');
  if(session)q.set('session',session);
  if(token)q.set('invite',token);
  history.replaceState(null,'',location.pathname+(q.toString()?'?'+q.toString():''));
}
function home(){
  token=null;session=null;test=true;setLocation();
  app.innerHTML='<span class="badge">🧪 PREVIEW MODE — NO REAL DRAW CHANGES</span>'+
    '<h2>✨ Welcome to Santa’s Secret Workshop ✨</h2>'+
    '<p>Try the entire Christmas experience before sending anyone an invitation. No passwords, no setup, no old draws.</p>'+
    '<div class="present" aria-hidden="true">🎁</div>'+
    '<button onclick="startTest(true)">🎄 Try it as Michael</button>'+
    '<button class="secondary" onclick="startTest(false)">Test all eight people</button>'+
    '<p><small>Each test creates a fresh, separate practice draw.</small></p>';
}
async function startTest(goMichael){
  festiveMusic();
  app.innerHTML='<h2>🎅 Santa’s getting everything ready…</h2><p>One moment!</p>';
  try{
    const out=await api('test-start',{test:true,session:null,token:null});
    session=out.session;test=true;token=null;setLocation();
    if(goMichael){const michael=out.invites.find(p=>p.name==='Michael');await choose(michael.token);}
    else showMenu(out.invites);
  }catch(e){error(e)}
}
function showMenu(invites){
  app.innerHTML='<span class="badge">🧪 TEST MODE</span><h2>Choose who to test</h2>'+
    '<p>All eight links are practice invitations. Choose anyone and experience the exact gift reveal.</p>'+
    '<div class="invites">'+invites.map(p=>'<button class="secondary" onclick="choose(\''+safe(p.token)+'\')">🎁 '+safe(p.name)+'</button>').join('')+'</div>'+
    '<hr class="divider"><button onclick="startTest(false)">🔄 Create a fresh test</button>';
}
async function testMenu(){
  if(!session){home();return}
  try{const result=await api('test-list');showMenu(result.invites)}
  catch(e){error(e)}
}
async function choose(t){
  token=t;test=true;setLocation();showEnvelope();
}
function showEnvelope(){
  app.innerHTML=(test?'<span class="badge">🧪 TEST MODE — PRACTICE ONLY</span>':'')+
    '<h2>✉️ A special delivery from the North Pole</h2>'+
    '<p>Santa has a secret Christmas mission just for you.</p><div class="present">🎁</div>'+
    '<button onclick="openInvite()">✨ Open my Christmas invitation</button>'+
    (test?'<p><button class="secondary" onclick="testMenu()">Try another person</button></p>':'');
}
async function openInvite(){
  festiveMusic();
  app.innerHTML='<h2>🎄 Opening your invitation…</h2>';
  try{state=await api('view');render()}catch(e){error(e)}
}
function giftForm(edit=false){
  const old=edit&&state.wishlist?state.wishlist:{wishes:['','',''],notes:''};
  let h='<h2>'+ (edit?'✏️ Update your Christmas wishes':'🎁 Tell Santa what you wish for')+'</h2>'+
    '<p>Choose three gift ideas within the £50 budget. Add sizes or shopping links if you like.</p>';
  for(let i=0;i<3;i++)h+='<label for="wish'+i+'">Christmas wish '+(i+1)+'</label><input id="wish'+i+'" maxlength="300" placeholder="Gift idea '+(i+1)+'" value="'+safe(old.wishes[i])+'">';
  h+='<label for="notes">Shopping links, sizes or extra hints (optional)</label><textarea id="notes" maxlength="1200">'+safe(old.notes)+'</textarea>'+
    '<button onclick="save()">✉️ Seal my wishlist</button>';
  return h;
}
function render(){
  if(!state){showEnvelope();return}
  let h=(test?'<span class="badge">🧪 TEST MODE</span>':'')+'<h2>Welcome, '+safe(state.name)+'! 🎄</h2>';
  if(!state.wishlist)h+=giftForm();
  else if(!state.revealed)h+='<p>Your wishes are safely sealed. Ready for your secret Christmas mission?</p>'+
    '<div class="present">🎁</div><button onclick="reveal()">✨ Unwrap my secret</button>';
  else {
    const wish=state.recipientWishlist;
    h+='<div class="reveal"><p>Shhh… your Christmas mission is to buy for</p>'+
      '<div class="name">🎁 '+safe(state.recipient)+' 🎁</div><p>🤫 Keep it a secret until Christmas!</p></div>'+
      '<hr class="divider"><h2>Their Christmas wishes</h2>';
    if(wish){
      if(wish.sample)h+='<p class="badge">Sample wishlist — this person has not filled theirs in yet</p>';
      h+='<ul class="gifts">'+wish.wishes.map(w=>'<li>✨ '+safe(w)+'</li>').join('')+'</ul>';
      if(wish.notes)h+='<p>'+safe(wish.notes)+'</p>';
    }else h+='<p>They have not completed their wishlist yet. Check back later.</p>';
    h+='<button class="secondary" onclick="editWishes()">✏️ Change my wishlist</button>'+
      '<button class="secondary" onclick="refresh()">🔄 Refresh their wishes</button>';
  }
  if(test)h+='<hr class="divider"><button class="secondary" onclick="testMenu()">Try another person</button>'+
    '<button class="secondary" onclick="startTest(true)">Start a fresh test</button>';
  app.innerHTML=h;
}
async function save(){
  const wishes=[0,1,2].map(i=>document.getElementById('wish'+i).value.trim());
  if(wishes.some(w=>!w)){alert('Santa needs three gift ideas before you can open your present.');return}
  const notes=document.getElementById('notes').value.trim();
  try{state=await api('save',{wishes,notes});render()}catch(e){error(e)}
}
async function reveal(){
  app.innerHTML='<h2>🎁 Santa is unwrapping your secret…</h2><div class="present">🎁</div>';
  try{state=await api('reveal');setTimeout(render,900)}catch(e){error(e)}
}
function editWishes(){app.innerHTML='<h2>Welcome, '+safe(state.name)+'!</h2>'+giftForm(true)}
async function refresh(){try{state=await api('view');render()}catch(e){error(e)}}
if(token)showEnvelope();else if(test&&session)testMenu();else home();
</script>
</body>
</html>
