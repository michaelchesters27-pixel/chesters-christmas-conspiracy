<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chesters Christmas Conspiracy</title><style>body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#24565a,#071b29);color:#fff4df;text-align:center;font-family:Georgia,serif}main{max-width:640px;margin:auto;padding:48px 20px}h1{font-size:clamp(40px,9vw,68px);line-height:1.08}h2{font-size:30px}p{line-height:1.6;font-size:18px}.card{padding:28px;border:1px solid #d6b575;border-radius:24px;background:#ffffff0c;margin-top:25px}button{background:#b82e39;color:white;padding:16px 25px;border-radius:30px;border:1px solid #f1d1a1;font-weight:bold;cursor:pointer;margin:10px}input,textarea{width:90%;padding:14px;margin:8px;border-radius:12px;font-size:16px}.snow{position:fixed;inset:0;pointer-events:none;opacity:.35;background-image:radial-gradient(white 1px,transparent 2px);background-size:55px 55px;animation:fall 12s linear infinite}@keyframes fall{to{background-position:0 550px}}small{color:#ead5b4}</style><div class="snow"></div><button id="musicToggle" onclick="toggleMusic()" style="position:fixed;top:12px;right:12px;z-index:10;background:#173b45;font-size:14px">🔔 Play Christmas music</button><main><div style="font-size:70px">🎅🏻</div><small>❄ A NORTH POLE EXCLUSIVE ❄</small><h1>The Chesters<br>Christmas Conspiracy</h1><p>Eight names. Four couples. One magical secret.</p><div class="card" id="app"></div><p><small>🎁 £50 maximum · Christmas 2026</small></p></main><script>
let audioCtx,musicTimer,musicOn=false,notes=[659.25,659.25,659.25,659.25,659.25,659.25,659.25,783.99,523.25,587.33,659.25,698.46,698.46,698.46,698.46,698.46,659.25,659.25,659.25,659.25,587.33,587.33,659.25,587.33,783.99];function note(freq,t,d){const o=audioCtx.createOscillator(),gain=audioCtx.createGain();o.type='sine';o.frequency.value=freq;gain.gain.setValueAtTime(0,t);gain.gain.linearRampToValueAtTime(.035,t+.03);gain.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(gain).connect(audioCtx.destination);o.start(t);o.stop(t+d+.02)}function toggleMusic(){if(musicOn){clearInterval(musicTimer);musicOn=false;document.getElementById('musicToggle').textContent='🔔 Play Christmas music';return}audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();audioCtx.resume();let i=0;function beat(){note(notes[i%notes.length],audioCtx.currentTime,.3);i++}beat();musicTimer=setInterval(beat,380);musicOn=true;document.getElementById('musicToggle').textContent='🔇 Mute music'}const app=document.getElementById('app'),params=new URLSearchParams(location.search),token=params.get('invite'),test=params.get('test')==='1';let state;function safe(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}async function api(action,extra={}){let r=await fetch('/.netlify/functions/santa',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,token,test,...extra})}),d=await r.json();if(!r.ok)throw Error(d.error);return d}function fail(e){alert(e.message)}async function start(){if(!token){app.innerHTML='<h2>✨ Santa’s secret workshop ✨</h2><p>Each family member gets their own private invitation. Make your wishlist, unwrap your name and keep your mission secret.</p>'+(test?'<p>🧪 TEST MODE — No real family invitations will be changed.</p><button onclick="setup()">Create test invitations</button><button onclick="resetTest()">Reset test draw</button>':'<p>The family invitations have already been generated. Use your private invitation link to continue.</p>');return}try{state=await api('view');render()}catch(e){app.innerHTML='<h2>Invitation unavailable</h2><p>'+safe(e.message)+'</p>'}}function render(){let h='<h2>Welcome, '+safe(state.name)+'! 🎄</h2>';if(!state.wishlist){h+='<p>Before Santa reveals your secret, tell him three things you would love for Christmas.</p>'+[1,2,3].map(i=>'<input id="w'+i+'" placeholder="Gift idea '+i+'">').join('')+'<textarea id="notes" placeholder="Optional shopping links, sizes or colors"></textarea><button onclick="save()">Seal my wishlist ✉️</button>'}else if(!state.revealed){h+='<p>Your wishes are safely sealed. Are you ready?</p><div style="font-size:80px">🎁</div><button onclick="reveal()">Unwrap my secret ✨</button>'}else{h+='<p>Your top-secret Christmas mission is...</p><h1>'+safe(state.recipient)+'</h1><p>🤫 Keep it secret!</p><h2>Their wishlist 🎁</h2>';h+=state.recipientWishlist?'<p>'+state.recipientWishlist.wishes.map(safe).join('<br>')+'</p><p>'+safe(state.recipientWishlist.notes)+'</p>':'<p>They haven’t submitted their wishes yet. Check back soon.</p>';h+='<button onclick="edit()">Edit my wishlist</button><button onclick="start()">Refresh wishlist</button>'}app.innerHTML=h}async function save(){try{const wishes=[1,2,3].map(i=>document.getElementById('w'+i).value.trim());if(wishes.some(x=>!x))return alert('Please add three gift ideas.');state=await api('save',{wishes,notes:document.getElementById('notes').value.trim()});render()}catch(e){fail(e)}}async function reveal(){try{state=await api('reveal');render()}catch(e){fail(e)}}function edit(){app.innerHTML='<h2>Update your wishlist</h2>'+state.wishlist.wishes.map((v,i)=>'<input id="w'+(i+1)+'" value="'+safe(v)+'">').join('')+'<textarea id="notes">'+safe(state.wishlist.notes)+'</textarea><button onclick="save()">Save changes</button>'}async function resetTest(){let code='';if(!confirm('Delete only the test draw and its test wishlists?'))return;try{await api('reset-test',{code});alert('Test draw reset. The real draw was not changed.');start()}catch(e){fail(e)}}async function setup(){let code=test?'':prompt('Enter the organizer setup code');if(!test&&!code)return;try{let r=await api('setup',{code});app.innerHTML='<h2>Private invitations ✉️</h2><p>Copy each invitation link. In test mode these links are for testing only; do not send them to family.</p>'+r.invites.map(p=>{let url=location.origin+'/?invite='+p.token+(test?'&test=1':'');return '<p><b>'+safe(p.name)+'</b><br><input readonly value="'+safe(url)+'" onclick="this.select()"></p>'}).join('')}catch(e){fail(e)}}start();</script></html>
